name: Publish paired digests

on:
  workflow_run:
    workflows:
      - "Daily Digest - Control"
      - "Daily Digest - Economy"
    types: [completed]
  schedule:
    - cron: "30 10 * * *"
  workflow_dispatch:

concurrency:
  group: digest-publishing
  cancel-in-progress: false

jobs:
  auto-merge:
    name: Merge validated digest PRs
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Merge isolated digest PRs (oldest first)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs="$(
            gh pr list \
              --repo "$REPO" \
              --state open \
              --base main \
              --label digest \
              --json number \
              --jq 'sort_by(.number) | .[].number'
          )"

          if [[ -z "$prs" ]]; then
            echo "No open digest PRs found."
            exit 0
          fi

          invalid=0
          declare -A control_prs=()
          declare -A economy_prs=()
          declare -A seen_snapshots=()
          snapshots=()

          for pr in $prs; do
            details="$(gh pr view "$pr" --repo "$REPO" --json author,files,isDraft,labels,title)"
            author="$(jq -r '.author.login' <<<"$details")"
            labels="$(jq -r '.labels[].name' <<<"$details")"
            title="$(jq -r '.title' <<<"$details")"
            is_draft="$(jq -r '.isDraft' <<<"$details")"

            expected_path=""
            variant=""
            variant_count=0
            if grep -qx "digest-control" <<<"$labels"; then
              expected_path="docs/index.html"
              variant="control"
              variant_count=$((variant_count + 1))
            fi
            if grep -qx "digest-economy" <<<"$labels"; then
              expected_path="docs/economy/index.html"
              variant="economy"
              variant_count=$((variant_count + 1))
            fi
            if [[ "$variant_count" -ne 1 ]]; then
              echo "Skipping PR #$pr because it has no recognized variant label."
              invalid=1
              continue
            fi

            mapfile -t files < <(jq -r '.files[].path' <<<"$details")
            if [[ "$author" != "app/github-actions" && "$author" != "github-actions" ]]; then
              echo "Refusing PR #$pr from unexpected author: $author" >&2
              invalid=1
              continue
            fi
            if [[ "$is_draft" == "true" ]]; then
              echo "Refusing draft PR #$pr." >&2
              invalid=1
              continue
            fi
            if [[ "${#files[@]}" -ne 1 || "${files[0]}" != "$expected_path" ]]; then
              echo "Refusing PR #$pr: expected only $expected_path." >&2
              printf 'Changed file: %s\n' "${files[@]}" >&2
              invalid=1
              continue
            fi

            if [[ "$variant" == "control" ]]; then
              title_pattern='^\[digest-control\] Publish Control digest for ([0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{12})$'
            else
              title_pattern='^\[digest-economy\] Publish Economy digest for ([0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9a-f]{12})$'
            fi
            if [[ ! "$title" =~ $title_pattern ]]; then
              echo "Refusing PR #$pr with unexpected title: $title" >&2
              invalid=1
              continue
            fi
            snapshot_id="${BASH_REMATCH[1]}"

            if [[ -z "${seen_snapshots[$snapshot_id]:-}" ]]; then
              snapshots+=("$snapshot_id")
              seen_snapshots[$snapshot_id]=1
            fi
            if [[ "$variant" == "control" ]]; then
              if [[ -n "${control_prs[$snapshot_id]:-}" ]]; then
                echo "Refusing duplicate control PRs for $snapshot_id." >&2
                invalid=1
                continue
              fi
              control_prs[$snapshot_id]="$pr"
            else
              if [[ -n "${economy_prs[$snapshot_id]:-}" ]]; then
                echo "Refusing duplicate economy PRs for $snapshot_id." >&2
                invalid=1
                continue
              fi
              economy_prs[$snapshot_id]="$pr"
            fi
          done

          if [[ "$invalid" -ne 0 ]]; then
            echo "One or more digest PRs failed validation." >&2
            exit 1
          fi

          merged_digests=0
          for snapshot_id in "${snapshots[@]}"; do
            control_pr="${control_prs[$snapshot_id]:-}"
            economy_pr="${economy_prs[$snapshot_id]:-}"

            for variant in control economy; do
              pr="${variant}_pr"
              pr="${!pr}"
              if [[ -z "$pr" ]]; then
                echo "No validated $variant digest is available for $snapshot_id."
                continue
              fi

              echo "Merging validated $variant digest for $snapshot_id"
              gh pr merge "$pr" --repo "$REPO" --squash --delete-branch
              merged_digests=$((merged_digests + 1))
            done
          done

          echo "Merged $merged_digests validated digest(s)."

  update-usage:
    name: Reconcile experiment ledger
    if: always()
    needs: auto-merge
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    outputs:
      commit_sha: ${{ steps.reconcile.outputs.commit_sha }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up gh-aw
        uses: github/gh-aw/actions/setup-cli@v0.81.6

      - name: Reconcile runs, credits, and page markers
        id: reconcile
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          audit_dir="${RUNNER_TEMP}/ai-credit-audits"
          run_dir="${RUNNER_TEMP}/digest-runs"
          mkdir -p "$audit_dir" "$run_dir"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "Reconciliation attempt $attempt"
            git fetch origin main
            git switch -C ai-credit-update origin/main

            while IFS='|' read -r workflow variant model digest_path; do
              mapfile -t runs < <(
                gh run list \
                  --repo "$REPO" \
                  --workflow "$workflow" \
                  --limit 1000 \
                  --json databaseId,displayTitle,event,status,conclusion,createdAt,startedAt,updatedAt,url,workflowName \
                  --jq '.[] | select(.status == "completed") | @base64'
              )

              for encoded in "${runs[@]}"; do
                run_json="$(base64 --decode <<<"$encoded")"
                run_id="$(jq -r '.databaseId' <<<"$run_json")"
                display_title="$(jq -r '.displayTitle' <<<"$run_json")"
                IFS=':' read -r title_variant snapshot_id prompt_version origin_event <<<"$display_title"

                if [[ "$title_variant" != "$variant" ||
                      -z "$snapshot_id" ||
                      -z "$prompt_version" ||
                      ( "$origin_event" != "schedule" && "$origin_event" != "workflow_dispatch" ) ]]; then
                  echo "Skipping run $run_id with unrecognized title: $display_title"
                  continue
                fi

                run_file="$run_dir/$run_id.json"
                printf '%s\n' "$run_json" > "$run_file"

                existing_aic="$(
                  jq -r --argjson run_id "$run_id" \
                    '.runs[]? | select(.runId == $run_id) | .aic // empty' \
                    docs/data/ai-credits.json
                )"
                audit_file="$audit_dir/$run_id.json"
                audit_args=()
                if [[ -z "$existing_aic" ]]; then
                  echo "Auditing $variant run $run_id"
                  if gh aw audit "$run_id" --json > "$audit_file"; then
                    audit_args=(--audit "$audit_file")
                  else
                    echo "Audit unavailable for run $run_id; retaining run status without cost."
                    rm -f "$audit_file"
                  fi
                  rm -rf .github/aw/logs
                fi

                node scripts/update-ai-credit-usage.mjs \
                  --run "$run_file" \
                  "${audit_args[@]}" \
                  --history docs/data/ai-credits.json \
                  --variant "$variant" \
                  --model "$model" \
                  --event "$origin_event" \
                  --snapshot-id "$snapshot_id" \
                  --prompt-version "$prompt_version" \
                  --digest "$digest_path"
              done
            done <<'VARIANTS'
          daily-digest-control.lock.yml|control|claude-sonnet-4.6|docs/index.html
          daily-digest-economy.lock.yml|economy|gpt-5-mini|docs/economy/index.html
          VARIANTS

            if git diff --quiet -- docs/index.html docs/economy/index.html docs/data/ai-credits.json; then
              echo "Experiment ledger is already current."
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add docs/index.html docs/economy/index.html docs/data/ai-credits.json
            git commit -m "chore: update digest experiment usage"
            if git push origin HEAD:main; then
              echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Main changed during reconciliation; retrying from latest."
          done

          echo "Unable to reconcile experiment usage after 3 attempts." >&2
          exit 1

  deploy:
    name: Deploy finalized GitHub Pages
    needs: update-usage
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout finalized pages
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.update-usage.outputs.commit_sha }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
