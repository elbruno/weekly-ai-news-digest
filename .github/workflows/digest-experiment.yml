name: Daily Digest Experiment
run-name: "Collect and dispatch paired digest"

on:
  schedule:
    # Avoid top-of-hour GitHub Actions scheduler congestion.
    - cron: "17 10 * * 1-5"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-digest-experiment
  cancel-in-progress: false

jobs:
  collect-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Collect deterministic news snapshot
        id: snapshot
        run: |
          python scripts/collect-news-snapshot.py \
            --output "$RUNNER_TEMP/news-snapshot.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload immutable snapshot
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: news-snapshot
          path: ${{ runner.temp }}/news-snapshot.json
          if-no-files-found: error
          retention-days: 90

      - name: Wait for snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            visible_id="$(
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
                --jq '.artifacts[] | select(.name == "news-snapshot") | .id' |
                head -n 1
            )"
            if [ "$visible_id" = "$ARTIFACT_ID" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Snapshot artifact was not visible after 30 seconds" >&2
          exit 1

      - name: Dispatch and wait for digest workers
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
          PROMPT_VERSION: v1
        run: |
          set -euo pipefail

          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          workflows=(daily-digest-control.lock.yml daily-digest-economy.lock.yml)
          variants=(control economy)
          run_ids=()

          for workflow in "${workflows[@]}"; do
            gh workflow run "$workflow" \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME" \
              -f "snapshot_run_id=$GITHUB_RUN_ID" \
              -f "snapshot_id=$SNAPSHOT_ID" \
              -f "prompt_version=$PROMPT_VERSION" \
              -f "origin_event=$GITHUB_EVENT_NAME"
          done

          for index in "${!workflows[@]}"; do
            workflow="${workflows[$index]}"
            variant="${variants[$index]}"
            expected_title="$variant:$SNAPSHOT_ID:$PROMPT_VERSION:$GITHUB_EVENT_NAME"

            for attempt in $(seq 1 60); do
              run_json="$(
                gh run list \
                  --repo "$GITHUB_REPOSITORY" \
                  --workflow "$workflow" \
                  --event workflow_dispatch \
                  --limit 20 \
                  --json databaseId,displayTitle,status,conclusion,createdAt,url |
                  jq -c \
                    --arg title "$expected_title" \
                    --arg since "$dispatched_at" \
                    '[.[] | select(.displayTitle == $title and .createdAt >= $since)]
                    | sort_by(.createdAt)
                    | first // empty'
              )"

              if [[ -n "$run_json" ]]; then
                run_ids[$index]="$(jq -r '.databaseId' <<<"$run_json")"
                echo "Found $variant run ${run_ids[$index]}."
                break
              fi
              echo "Waiting for $variant worker run to appear."
              sleep 5
            done

            if [[ -z "${run_ids[$index]:-}" ]]; then
              echo "Timed out waiting for the $variant worker run to appear." >&2
              exit 1
            fi
          done

          successful_workers=0
          for index in "${!run_ids[@]}"; do
            variant="${variants[$index]}"
            run_id="${run_ids[$index]}"
            echo "Waiting for $variant run $run_id."
            gh run watch "$run_id" \
              --repo "$GITHUB_REPOSITORY" \
              --interval 10 || true

            conclusion="$(
              gh run view "$run_id" \
                --repo "$GITHUB_REPOSITORY" \
                --json conclusion \
                --jq '.conclusion'
            )"
            if [[ "$conclusion" == "success" ]]; then
              successful_workers=$((successful_workers + 1))
            fi
            echo "$variant run $run_id concluded: $conclusion"
          done

          if [[ "$successful_workers" -eq 0 ]]; then
            echo "Neither digest worker succeeded; publication will not be dispatched." >&2
            exit 1
          fi

          gh workflow run auto-merge-digest.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"

          if [[ "$successful_workers" -ne "${#run_ids[@]}" ]]; then
            echo "One or more workers failed; successfully generated digests were sent for independent publication." >&2
          fi

      - name: Write experiment summary
        env:
          SNAPSHOT_ID: ${{ steps.snapshot.outputs.snapshot_id }}
          ARTICLE_COUNT: ${{ steps.snapshot.outputs.article_count }}
        run: |
          {
            echo "## Digest workers completed"
            echo
            echo "- Snapshot: \`$SNAPSHOT_ID\`"
            echo "- Articles: $ARTICLE_COUNT"
            echo "- Control model: \`claude-sonnet-5\`"
            echo "- Economy model: \`gpt-5-mini\`"
            echo "- Prompt: \`v1\`"
            echo "- Publisher: dispatched when at least one worker succeeded"
          } >> "$GITHUB_STEP_SUMMARY"
